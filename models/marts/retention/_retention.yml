version: 2

models:
  - name: fct_customer_lifecycle
    description: >
      One row per customer as of today. Lifecycle stage uses days since last order against the active_days,
      cooling_days and churn_days variables. Churn means inactivity, not a cancelled contract.
    columns:
      - name: customer_key
        tests: [unique, not_null]
      - name: lifecycle_stage
        tests:
          - accepted_values:
              arguments:
                values: ['Active', 'Cooling', 'At risk', 'Lapsed']

  - name: fct_cohort_retention
    description: Share of each acquisition cohort ordering in each later calendar month, by channel.
    columns:
      - name: retention_rate
        tests: [not_null]

  - name: rpt_reactivation_by_inactivity
    description: Chance of ordering again after N days of silence. Basis for the churn cutoff.

  - name: rpt_lifecycle_summary
    description: One row per lifecycle stage x channel, with customer count, revenue and average recency. Rollup of fct_customer_lifecycle for dashboards.

  - name: rpt_funnel
    description: >
      Session-level view-to-cart-to-purchase funnel by session_source, built directly from stg_thelook__events
      (not from the star schema). Events exist only for customers who went on to buy, so rates here are
      higher than a real site would show — use for shape, not absolute conversion.
